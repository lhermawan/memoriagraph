name: Benchmark & Drift Tracking

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Operational Benchmark
      run: |
        python benchmark_v3.py
