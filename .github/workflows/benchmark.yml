name: Benchmark & Drift Tracking

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/maskiisecret
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: --health-cmd "cypher-shell -u neo4j -p maskiisecret 'RETURN 1;'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Initialize Neo4j Schema
      env:
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: maskiisecret
      run: |
        python -c "from src.schema_init import init_schema; init_schema()"

    - name: Run Operational Benchmark
      env:
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: maskiisecret
      run: |
        python benchmark_v3.py
