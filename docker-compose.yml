version: '3.8'

services:
  neo4j:
    image: neo4j:5.18
    container_name: memoriagraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-memoriagraph}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  mcp-server:
    build: ./mcp
    container_name: memoriagraph-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-memoriagraph}
      - MCP_PORT=3000
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
