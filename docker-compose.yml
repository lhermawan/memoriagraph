version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: memoriagraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-memoriagraph_pass}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  memoriagraph:
    build: .
    container_name: memoriagraph-engine
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8085:8085" # HTTP API Gateway & Cybernetic Cockpit
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-memoriagraph_pass}
      - SECURITY_NETWORK_MODE=private
      - MEMORIAGRAPH_HTTP_HOST=0.0.0.0
      - MEMORIAGRAPH_HTTP_PORT=8085
    volumes:
      - memoriagraph_data:/app/data
      - ./events:/app/events
      - ./logs:/app/logs
      - ./banks.json:/app/banks.json

volumes:
  neo4j_data:
  memoriagraph_data:
